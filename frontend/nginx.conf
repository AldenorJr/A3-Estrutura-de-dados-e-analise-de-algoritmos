server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip basico
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # HTML, CSS e JS sempre revalidados (sem build/hash nos nomes, entao um
    # cache longo serviria versoes antigas apos um deploy). "no-cache" mantem
    # o arquivo em cache, mas o navegador revalida via ETag (304 se nao mudou).
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }
    # imagens e fontes raramente mudam: cache longo de verdade
    location ~* \.(svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
